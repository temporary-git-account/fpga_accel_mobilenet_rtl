<svg viewBox="0 0 770 425" role="img" aria-labelledby="arch-title" xmlns="http://www.w3.org/2000/svg"><title id="arch-title">Layer control feeds banks, vector MAC and requantizer; shared memory port connects through a cache to DDR.</title><rect width="770" height="425" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#376f98"/></marker></defs><g font-family="system-ui" fill="#173a53"><rect x="15" y="20" width="220" height="66" rx="6" fill="#eaf2f8" stroke="#85a8c3"/><text x="125.0" y="45" text-anchor="middle" font-size="14" font-weight="600">AXI-Lite control</text><text x="125.0" y="67" text-anchor="middle" font-size="11" fill="#536e83">descriptor • START • DONE • ACK</text><rect x="270" y="20" width="230" height="66" rx="6" fill="#eaf2f8" stroke="#85a8c3"/><text x="385.0" y="45" text-anchor="middle" font-size="14" font-weight="600">Layer engine</text><text x="385.0" y="67" text-anchor="middle" font-size="11" fill="#536e83">coordinates • schedule • bounds</text><path d="M235,53 L270,53" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="125" width="230" height="66" rx="6" fill="#eaf2f8" stroke="#85a8c3"/><text x="385.0" y="150" text-anchor="middle" font-size="14" font-weight="600">On-chip tile banks</text><text x="385.0" y="172" text-anchor="middle" font-size="11" fill="#536e83">4 activation banks • 8 weight banks</text><path d="M385,86 L385,125" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="230" width="230" height="66" rx="6" fill="#eaf2f8" stroke="#85a8c3"/><text x="385.0" y="255" text-anchor="middle" font-size="14" font-weight="600">32-lane vector MAC</text><text x="385.0" y="277" text-anchor="middle" font-size="11" fill="#536e83">4 pixels × 8 output channels</text><path d="M385,191 L385,230" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="335" width="230" height="66" rx="6" fill="#eaf2f8" stroke="#85a8c3"/><text x="385.0" y="360" text-anchor="middle" font-size="14" font-weight="600">One requantizer</text><text x="385.0" y="382" text-anchor="middle" font-size="11" fill="#536e83">serialize sums • 8 registered stages</text><path d="M385,296 L385,335" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><rect x="535" y="125" width="220" height="66" rx="6" fill="#eaf2f8" stroke="#85a8c3"/><text x="645.0" y="150" text-anchor="middle" font-size="14" font-weight="600">128-byte read cache</text><text x="645.0" y="172" text-anchor="middle" font-size="11" fill="#536e83">8 lines • 16 bytes each</text><rect x="535" y="230" width="220" height="66" rx="6" fill="#eaf2f8" stroke="#85a8c3"/><text x="645.0" y="255" text-anchor="middle" font-size="14" font-weight="600">AXI4 memory master</text><text x="645.0" y="277" text-anchor="middle" font-size="11" fill="#536e83">64-bit • one outstanding request</text><rect x="535" y="335" width="220" height="66" rx="6" fill="#edf5f0" stroke="#85a8c3"/><text x="645.0" y="360" text-anchor="middle" font-size="14" font-weight="600">DDR tensors</text><text x="645.0" y="382" text-anchor="middle" font-size="11" fill="#536e83">weights • input • output</text><path d="M645,191 L645,230" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M645,296 L645,335" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M500,53 L645,53 L645,125" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M500,368 L515,368 L515,263 L535,263" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><text x="532" y="41" font-size="10">load requests</text><text x="513" y="314" font-size="10" transform="rotate(-90 513 314)">output writes</text></g></svg>
