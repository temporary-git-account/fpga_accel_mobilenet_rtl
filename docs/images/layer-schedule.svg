<svg xmlns="http://www.w3.org/2000/svg" width="920" height="550" viewBox="0 0 920 550" role="img" aria-labelledby="title desc">
<title id="title">Layer scheduling phases</title><desc id="desc">Capture and validate, load weights and parameters, select pixels and load activations, read and feed the MAC, drain sums, requantize, write valid lanes, then select the next tile, channel group, or completion. Memory phases use shared request and response states.</desc>
<rect width="920" height="550" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#376f98"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#173a53"><text x="30" y="35" font-size="23" text-anchor="start" fill="#173a53">The repeated tile schedule</text><rect x="30" y="70" width="410" height="70" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="235.0" y="96" font-size="16" text-anchor="middle" fill="#173a53">1. Capture / validate</text><text x="235.0" y="118" font-size="12" text-anchor="middle" fill="#173a53">IDLE → CHECK</text><rect x="475" y="70" width="410" height="70" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="680.0" y="96" font-size="16" text-anchor="middle" fill="#173a53">2. Weights / parameters</text><text x="680.0" y="118" font-size="12" text-anchor="middle" fill="#173a53">W_ADDR / W_NEXT; P_ADDR / P_NEXT</text><rect x="475" y="180" width="410" height="70" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="680.0" y="206" font-size="16" text-anchor="middle" fill="#173a53">3. Pixels / activations</text><text x="680.0" y="228" font-size="12" text-anchor="middle" fill="#173a53">PIX_*; A_*</text><rect x="30" y="180" width="410" height="70" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="235.0" y="206" font-size="16" text-anchor="middle" fill="#173a53">4. Read / feed MAC</text><text x="235.0" y="228" font-size="12" text-anchor="middle" fill="#173a53">RUN_READ ↔ RUN_FEED</text><rect x="30" y="290" width="410" height="70" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="235.0" y="316" font-size="16" text-anchor="middle" fill="#173a53">5. Drain sums</text><text x="235.0" y="338" font-size="12" text-anchor="middle" fill="#173a53">SUM_WAIT</text><rect x="475" y="290" width="410" height="70" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="680.0" y="316" font-size="16" text-anchor="middle" fill="#173a53">6. Requantize lanes</text><text x="680.0" y="338" font-size="12" text-anchor="middle" fill="#173a53">Q_SEND / Q_WAIT</text><rect x="475" y="400" width="410" height="70" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="680.0" y="426" font-size="16" text-anchor="middle" fill="#173a53">7. Write valid outputs</text><text x="680.0" y="448" font-size="12" text-anchor="middle" fill="#173a53">O_ADDR / O_NEXT</text><rect x="30" y="400" width="410" height="70" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="235.0" y="426" font-size="16" text-anchor="middle" fill="#173a53">8. Advance or finish</text><text x="235.0" y="448" font-size="12" text-anchor="middle" fill="#173a53">NEXT_TILE → next tile / group / FINISH</text><path d="M440,105 L475,105" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M680,140 L680,180" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M475,215 L440,215" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M235,250 L235,290" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,325 L475,325" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M680,360 L680,400" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M475,435 L440,435" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="512" font-size="15" text-anchor="start" fill="#173a53">Memory phases share MREQ / MWAIT. Loading, computation and stores are largely serialized.</text><text x="30" y="536" font-size="14" text-anchor="start" fill="#173a53">Next spatial tile returns to phase 3; next channel group returns to phase 2.</text></g></svg>
