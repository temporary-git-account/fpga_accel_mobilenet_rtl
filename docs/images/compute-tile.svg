<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">The 4 by 8 compute tile and tail masking</title><desc id="desc">Four output pixel rows and eight output channel columns. A three-pixel, five-channel tail enables 15 lanes and masks 17. Regular convolution shares an activation across each row; depthwise uses a distinct activation per lane.</desc>
<rect width="920" height="500" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#376f98"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#173a53"><text x="30" y="34" font-size="21" text-anchor="start" fill="#173a53">32 physical MAC lanes; each cell owns an independent sum</text><text x="30" y="62" font-size="15" text-anchor="start" fill="#173a53">Example tail: 3 valid pixels × 5 valid channels = 15 useful lanes (46.875%)</text><text x="185" y="106" font-size="14" text-anchor="middle" fill="#173a53">c0</text><text x="273" y="106" font-size="14" text-anchor="middle" fill="#173a53">c1</text><text x="361" y="106" font-size="14" text-anchor="middle" fill="#173a53">c2</text><text x="449" y="106" font-size="14" text-anchor="middle" fill="#173a53">c3</text><text x="537" y="106" font-size="14" text-anchor="middle" fill="#173a53">c4</text><text x="625" y="106" font-size="14" text-anchor="middle" fill="#173a53">c5</text><text x="713" y="106" font-size="14" text-anchor="middle" fill="#173a53">c6</text><text x="801" y="106" font-size="14" text-anchor="middle" fill="#173a53">c7</text><text x="108" y="155" font-size="14" text-anchor="end" fill="#173a53">pixel 0</text><rect x="146" y="122" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="185" y="145" font-size="13" text-anchor="middle" fill="#173a53">p0, c0</text><text x="185" y="165" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="234" y="122" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="273" y="145" font-size="13" text-anchor="middle" fill="#173a53">p0, c1</text><text x="273" y="165" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="322" y="122" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="361" y="145" font-size="13" text-anchor="middle" fill="#173a53">p0, c2</text><text x="361" y="165" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="410" y="122" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="449" y="145" font-size="13" text-anchor="middle" fill="#173a53">p0, c3</text><text x="449" y="165" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="498" y="122" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="537" y="145" font-size="13" text-anchor="middle" fill="#173a53">p0, c4</text><text x="537" y="165" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="586" y="122" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="625" y="145" font-size="13" text-anchor="middle" fill="#173a53">p0, c5</text><text x="625" y="165" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="674" y="122" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="713" y="145" font-size="13" text-anchor="middle" fill="#173a53">p0, c6</text><text x="713" y="165" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="762" y="122" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="801" y="145" font-size="13" text-anchor="middle" fill="#173a53">p0, c7</text><text x="801" y="165" font-size="12" text-anchor="middle" fill="#173a53">masked</text><text x="108" y="222" font-size="14" text-anchor="end" fill="#173a53">pixel 1</text><rect x="146" y="189" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="185" y="212" font-size="13" text-anchor="middle" fill="#173a53">p1, c0</text><text x="185" y="232" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="234" y="189" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="273" y="212" font-size="13" text-anchor="middle" fill="#173a53">p1, c1</text><text x="273" y="232" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="322" y="189" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="361" y="212" font-size="13" text-anchor="middle" fill="#173a53">p1, c2</text><text x="361" y="232" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="410" y="189" width