">p2, c2</text><text x="361" y="299" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="410" y="256" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="449" y="279" font-size="13" text-anchor="middle" fill="#173a53">p2, c3</text><text x="449" y="299" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="498" y="256" width="78" height="57" rx="5" fill="#e0f1ea" stroke="#4a8870"/><text x="537" y="279" font-size="13" text-anchor="middle" fill="#173a53">p2, c4</text><text x="537" y="299" font-size="12" text-anchor="middle" fill="#173a53">MAC</text><rect x="586" y="256" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="625" y="279" font-size="13" text-anchor="middle" fill="#173a53">p2, c5</text><text x="625" y="299" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="674" y="256" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="713" y="279" font-size="13" text-anchor="middle" fill="#173a53">p2, c6</text><text x="713" y="299" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="762" y="256" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="801" y="279" font-size="13" text-anchor="middle" fill="#173a53">p2, c7</text><text x="801" y="299" font-size="12" text-anchor="middle" fill="#173a53">masked</text><text x="108" y="356" font-size="14" text-anchor="end" fill="#173a53">pixel 3</text><rect x="146" y="323" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="185" y="346" font-size="13" text-anchor="middle" fill="#173a53">p3, c0</text><text x="185" y="366" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="234" y="323" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="273" y="346" font-size="13" text-anchor="middle" fill="#173a53">p3, c1</text><text x="273" y="366" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="322" y="323" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="361" y="346" font-size="13" text-anchor="middle" fill="#173a53">p3, c2</text><text x="361" y="366" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="410" y="323" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="449" y="346" font-size="13" text-anchor="middle" fill="#173a53">p3, c3</text><text x="449" y="366" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="498" y="323" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="537" y="346" font-size="13" text-anchor="middle" fill="#173a53">p3, c4</text><text x="537" y="366" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="586" y="323" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="625" y="346" font-size="13" text-anchor="middle" fill="#173a53">p3, c5</text><text x="625" y="366" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="674" y="323" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="713" y="346" font-size="13" text-anchor="middle" fill="#173a53">p3, c6</text><text x="713" y="366" font-size="12" text-anchor="middle" fill="#173a53">masked</text><rect x="762" y="323" width="78" height="57" rx="5" fill="#eef0f3" stroke="#b5bdc6"/><text x="801" y="346" font-size="13" text-anchor="middle" fill="#173a53">p3, c7</text><text x="801" y="366" font-size="12" text-anchor="middle" fill="#173a53">masked</text><text x="30" y="423" font-size="17" text-anchor="start" fill="#173a53">Regular:    sum[p,c] += activation[p] × weight[c]</text><text x="30" y="451" font-size="17" text-anchor="start" fill="#173a53">Depthwise: sum[p,c] += activation[p,c] × weight[c]</text><text x="30" y="478" font-size="14" text-anchor="start" fill="#173a53">Weights repeat across four pixels. Masked lanes never write an output byte.</text></g></svg>
