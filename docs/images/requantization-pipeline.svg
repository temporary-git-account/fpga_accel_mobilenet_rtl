<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
<title id="title">Eight-stage requantization pipeline</title><desc id="desc">Bias and checks, four partial products, shifted partial sums, signed 64-bit recombination, Q31 high rounding, right shift with guard and sticky bits, rounding increment and zero point, then clamp and result. Backpressure holds all stages together.</desc>
<rect width="920" height="450" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#376f98"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#173a53"><text x="30" y="34" font-size="23" text-anchor="start" fill="#173a53">One shared requantizer: eight registered stages</text><rect x="25" y="75" width="195" height="80" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="122.5" y="101" font-size="16" text-anchor="middle" fill="#173a53">0 · Bias + checks</text><text x="122.5" y="123" font-size="12" text-anchor="middle" fill="#173a53">int32 accumulator + bias</text><rect x="250" y="75" width="195" height="80" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="347.5" y="101" font-size="16" text-anchor="middle" fill="#173a53">1 · Partial products</text><text x="347.5" y="123" font-size="12" text-anchor="middle" fill="#173a53">four DSP multipliers</text><rect x="475" y="75" width="195" height="80" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="572.5" y="101" font-size="16" text-anchor="middle" fill="#173a53">2 · Shifted sums</text><text x="572.5" y="123" font-size="12" text-anchor="middle" fill="#173a53">two 48-bit fabric sums</text><rect x="700" y="75" width="195" height="80" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="797.5" y="101" font-size="16" text-anchor="middle" fill="#173a53">3 · Recombine</text><text x="797.5" y="123" font-size="12" text-anchor="middle" fill="#173a53">signed 64-bit product</text><rect x="700" y="225" width="195" height="80" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="797.5" y="251" font-size="16" text-anchor="middle" fill="#173a53">4 · Q31 high rounding</text><text x="797.5" y="273" font-size="12" text-anchor="middle" fill="#173a53">floor((product + 2³⁰) / 2³¹)</text><rect x="475" y="225" width="195" height="80" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="572.5" y="251" font-size="16" text-anchor="middle" fill="#173a53">5 · Right shift</text><text x="572.5" y="273" font-size="12" text-anchor="middle" fill="#173a53">guard / sticky rounding flag</text><rect x="250" y="225" width="195" height="80" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="347.5" y="251" font-size="16" text-anchor="middle" fill="#173a53">6 · Round + zero point</text><text x="347.5" y="273" font-size="12" text-anchor="middle" fill="#173a53">increment + output zero point</text><rect x="25" y="225" width="195" height="80" rx="7" fill="#eaf2f8" stroke="#85a8c3"/><text x="122.5" y="251" font-size="16" text-anchor="middle" fill="#173a53">7 · Clamp + publish</text><text x="122.5" y="273" font-size="12" text-anchor="middle" fill="#173a53">int8 result + aligned error</text><path d="M220,115 L250,115" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M445,115 L475,115" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M670,115 L700,115" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M797,155 L797,225" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M700,265 L670,265" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M475,265 L445,265" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,265 L220,265" fill="none" stroke="#376f98" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="355" font-size="16" text-anchor="start" fill="#173a53">Throughput: one input per advancing cycle; 32 tile sums share this pipeline.</text><text x="30" y="386" font-size="15" text-anchor="start" fill="#173a53">Backpressure holds values, validity and error metadata together across every stage.</text><text x="30" y="417" font-size="14" text-anchor="start" fill="#173a53">Stage 2 keeps shifted recombination in fabric; the four product multipliers remain DSPs.</text></g></svg>
